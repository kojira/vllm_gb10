name: Node runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build every frontend Docker stage and verify the patched runtime
        working-directory: frontend-react
        run: |
          for stage in builder runtime; do
            docker build --pull --target "$stage" -t "vllm-frontend-ci:$stage" .
            docker run --rm --network none --entrypoint node "vllm-frontend-ci:$stage" -e 'require("node:assert/strict").equal(process.versions.node, "22.23.4")'
          done
      - name: Verify production server and static assets
        run: |
          docker run --rm --network none --entrypoint node vllm-frontend-ci:runtime --check server/index.js
          docker run --detach --name frontend-ci --network none vllm-frontend-ci:runtime
          docker exec frontend-ci node --input-type=module -e 'import assert from "node:assert/strict"; let response; for (let attempt = 0; attempt < 30; attempt++) { try { response = await fetch("http://127.0.0.1:3000/"); break; } catch { await new Promise(resolve => setTimeout(resolve, 100)); } } assert.ok(response, "server did not start"); assert.equal(response.status, 200); assert.match(await response.text(), /<div id="root"><\/div>/);'
      - name: Container logs
        if: failure()
        run: |
          if [ -n "$(docker ps --all --quiet --filter name=^frontend-ci$)" ]; then
            docker logs frontend-ci
          fi
      - name: Remove test container
        if: always()
        run: docker rm --force frontend-ci
